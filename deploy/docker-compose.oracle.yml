# Domain-free variant: the dashboard is published on the server's localhost only.
# Reach it from your PC with an SSH tunnel:  ssh -L 8765:127.0.0.1:8765 opc@<server-ip>
# Run from /opt/gta6clipper/deploy:  sudo docker compose -f docker-compose.oracle.yml up -d --build

services:
  clipper:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    environment:
      CLIPPER_REVIEW_HOST: 0.0.0.0   # inside the container; the host side below is localhost only
      CLIPPER_CAPTION_FONT: Anton
      CLIPPER_ENCODER: libx264
      CLIPPER_BEHIND_PROXY: "1"
    volumes:
      - ../config.toml:/app/config.toml:ro
      - ../secrets:/app/secrets
      - ../data:/app/data
    ports:
      - "127.0.0.1:8765:8765"
    stop_grace_period: 30s
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }
