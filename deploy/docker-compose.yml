# Runs on the cloud server from /opt/gta6clipper/deploy:
#   sudo docker compose up -d --build
# CLIPPER_DOMAIN comes from deploy/.env, written by deploy.sh.

services:
  clipper:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    environment:
      CLIPPER_REVIEW_HOST: 0.0.0.0   # reachable by Caddy on the private network only
      CLIPPER_CAPTION_FONT: Anton
      CLIPPER_ENCODER: libx264
      CLIPPER_BEHIND_PROXY: "1"      # only reachable through Caddy's password
    volumes:
      - ../config.toml:/app/config.toml:ro
      - ../secrets:/app/secrets      # API keys, OAuth tokens (token refresh writes here)
      - ../data:/app/data            # database, recordings, clips, logs
    expose:
      - "8765"                       # not published: only Caddy can reach the dashboard
    stop_grace_period: 30s
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on: [clipper]
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      CLIPPER_DOMAIN: ${CLIPPER_DOMAIN:?set CLIPPER_DOMAIN in deploy/.env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./public:/srv/public:ro       # /about, /privacy, /terms (public)
      - ../secrets/auth.caddy:/etc/caddy/auth.caddy:ro
      - caddy_data:/data             # HTTPS certificates
      - caddy_config:/config
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

volumes:
  caddy_data: {}
  caddy_config: {}
