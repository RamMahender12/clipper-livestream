# Copy to config.toml (`clipper init`) and edit. Secrets never go here.

[paths]
data_dir = "data"
whisper_model = "models/ggml-base.en.bin"   # bigger = better captions: ggml-small.en.bin

[record]
quality = "1080p60,1080p,720p60,best"
segment_seconds = 30
retain_minutes = 90        # raw stream segments older than this are deleted
poll_seconds = 60          # how often to check whether a channel went live
keep_awake = true          # stop the Mac idle-sleeping while recording (closing the lid still sleeps it)

[detect]                   # chat-spike detection
window_seconds = 10
baseline_windows = 30      # 5 min of history defines "normal" chat speed
min_ratio = 2.5            # spike = 2.5x the median window...
min_z = 3.0                # ...or 3 standard deviations above the mean
min_messages = 12          # ignore tiny chats
clip_mentions = 3          # 3+ people typing "clip it" in one window also counts
cooldown_seconds = 45

[clip]
pre_seconds = 20           # seconds kept before the moment chat reacted to
post_seconds = 10
chat_delay_seconds = 3     # chat reacts this many seconds after the moment
layout = "blur"            # blur | facecam_split | crop (channels can override)
zoom = 1.35                # blur layout: >1 crops the sides so gameplay fills more of the frame
fps = 60
encoder = "libx264"        # h264_videotoolbox renders ~3x faster on a Mac
max_per_hour_per_channel = 12
render_workers = 1

[captions]
enabled = true
words_per_chunk = 3
font = "Arial Black"
font_size = 84
hook_seconds = 3.0

[ai]                       # needs ANTHROPIC_API_KEY in the environment; templates otherwise
enabled = true
model = "claude-opus-5-5"
effort = "medium"
page_handle = "@yourpage"
niche = "GTA 6 launch-week clips"
voice = "short, punchy, funny, never mean; no spoilers"

[auto_approve]
# The AI approves clips on its own, using your past posts' views plus a Claude
# review of each clip. Needs ANTHROPIC_API_KEY; without it every clip waits for you.
# Never auto-approved, whatever these settings say: test footage, spoiler or
# unsafe flags, clips without an AI spoiler check, channels without permission.
enabled = true
min_history = 15           # posts with view data before your stats are trusted
mature_hours = 24          # a post's views count once it's this old
min_percentile = 0.45      # history must predict the clip beats 45% of your past posts
min_confidence = 7         # Claude's confidence (1-10)
cold_start_min_quality = 8 # stricter bar until there's history
max_per_day = 20
cold_start_max_per_day = 6
auto_reject = true         # also drop clips both the AI and history call weak
expire_hours = 12          # unposted clips older than this are dropped (launch news goes stale)
allow_spoiler_low = false
veto_minutes = 10          # auto-approved clips wait this long so you can undo them
effort = "high"            # Claude effort for the approval review

[review]
host = "127.0.0.1"
port = 8765

[posting]
# export = write mp4 + caption .txt to data/export/ for posting from your phone (safest start).
# youtube / instagram / tiktok = official APIs (see README for one-time setup).
platforms = ["export"]
min_gap_minutes = 45
quiet_hours = []           # local hours with no posting, e.g. [3, 4, 5]
timezone = "Asia/Kolkata"
# An upload that failed before anything reached the account (token, quota, network at the start)
# is tried again after these waits. One that may have gone up (e.g. YouTube lost contact after the
# last bytes) is never retried on its own: a duplicate post looks like spam.
retry_minutes = [10, 30, 90]

[posting.max_posts_per_day]
youtube = 10
instagram = 8
tiktok = 5                 # TikTok allows ~5 pending inbox drafts per 24h
export = 1000

[retention]                # media of clips that are done (posted, rejected, failed); live clips are never touched
raw_hours = 24             # raw cuts (~60 MB each) are deleted this long after the clip is done
rejected_days = 3          # rendered mp4s of rejected/failed clips (thumbnails stay)
posted_days = 14           # rendered mp4s of posted clips
min_free_gb = 5            # under this: delete all of the above now and alert on Telegram

# ---------------------------------------------------------------------------
# Campaigns: paid clipping programs you've joined (Whop Content Rewards etc.).
# Copy the numbers from the campaign brief. Only clips of channels linked to a
# campaign earn money, and only on the platforms the campaign lists.
# ---------------------------------------------------------------------------
[[campaigns]]
id = "example-streamer"
name = "EXAMPLE - replace with a real campaign you joined"
url = "https://whop.com/discover/"
active = false
rate_per_1k = 1.00          # USD per 1,000 views
cap_per_clip = 150          # max payout for one clip
min_views = 1000            # views needed before a clip pays at all
platforms = ["tiktok", "instagram", "youtube"]
required_tags = ["#ad"]
disclosure = "#ad"          # paid campaigns are ads: disclose them
paid_promotion = true
notes = "Paste brief rules here: facecam visible, handle on screen, no radio music, etc."

# ---------------------------------------------------------------------------
# Channels: who to record. permission is REQUIRED:
#   "campaign:<campaign id>"  the streamer pays clippers via that campaign
#   "written:<link>"          the streamer told you in writing you may clip & post
#   "own"                     your own gameplay/stream
#   "test"                    record + render locally only, never posted
# ---------------------------------------------------------------------------
[[channels]]
login = "xqc"
display_name = "xQc"
credit = "twitch.tv/xqc"
permission = "test"
